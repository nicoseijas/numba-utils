<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="numba-utils">
  <title>numba-utils</title>
  <!-- Monochrome mark: parallel blocks feeding one compiled kernel.
       Hardcoded white — Material renders theme.logo as an <img>, so
       currentColor would resolve to black on the indigo header. -->
  <g fill="#ffffff">
    <path d="M32 6 51 34H13Z"/>
    <rect x="10" y="44" width="14" height="14" rx="3" fill-opacity="0.7"/>
    <rect x="25" y="44" width="14" height="14" rx="3"/>
    <rect x="40" y="44" width="14" height="14" rx="3" fill-opacity="0.7"/>
  </g>
</svg>
